# Índice de cobertura de documentación — <proyecto>
# Generado por el skill sdd-documentacion-arquitectura en modo exhaustivo.
# NO editar a mano las entradas documentadas — se actualiza en cada tanda.
# Para forzar la regeneración de un documento: cambiar su status a "pending".
#
# Frescura: ref_branch + commit_hash indican contra qué versión del código se generó cada doc.
# En cada corrida, las entradas 'documented' se revalidan contra la branch de referencia
# (rama base de §1 del perfil del proyecto). Si los source_paths cambiaron en esa branch desde el
# commit_hash guardado, la entrada pasa a 'stale' y se regenera.
# Nunca borrar entradas: 'skipped' (con skip_reason) también es información.

# NOTA: las entradas de abajo son EJEMPLOS ilustrativos (un backend con eje "dominio").
# Reemplazarlas por las unidades reales del inventario E1 de ESTE repo, agrupadas por el eje
# de §6 del perfil, con las rutas reales de §4.

